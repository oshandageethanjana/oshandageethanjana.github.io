<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Redirecting to Oshanda.com</title>
    
    <!-- SEO සඳහා අලුත් සයිට් එක හඳුන්වා දීම (Canonical URL) -->
    <link rel="canonical" href="https://oshanda.com">
    
    <!-- තත්පර 0න් අලුත් සයිට් එකට යැවීම (HTML Meta Refresh) -->
    <meta http-equiv="refresh" content="0; url=https://oshanda.com">
</head>
<body>
    <p>If you are not redirected automatically, follow this <a href="https://oshanda.com">link to the new website</a>.</p>
    
    <!-- JavaScript හරහාත් Redirect කිරීම (අමතර ආරක්ෂාවට) -->
    <script>
        window.location.href = "https://oshanda.com";
    </script>
</body>
</html>
